[project]
name = "am02-subscreen"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.7,<1"]
build-backend = "uv_build"

[project.scripts]
am02-subscreend = "am02_subscreen.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
